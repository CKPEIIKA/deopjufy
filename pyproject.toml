[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deopjufier"
version = "0.6.0"
description = "Unix-style extractor for OriginLab OPJ/OPJU project files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {text = "GPL-3.0-or-later"}
keywords = [
    "origin",
    "opj",
    "opju",
    "binary-analysis",
    "extractor",
]
authors = [{name = "deopjufier contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
deopjufy = "deopjufier.cli:cli_entrypoint"
deopjufy-view = "deopjufy_view.app:cli_entrypoint"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["deopjufier", "deopjufier.*", "deopjufy_view", "deopjufy_view.*"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "ruff>=0.16", "ty"]
xlsx = ["openpyxl>=3.1"]
image = ["pillow"]
re = ["python-magic", "construct", "kaitaistruct"]
viewer = ["wxPython>=4.2", "openpyxl>=3.1"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["refs", "tmp", ".venv", ".uv-cache", ".pytest_cache", ".ruff_cache", ".mypy_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PLR", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "SIM102"]
# Optional wx classes are constructed after dependency discovery so importing the
# core package never imports wxPython; Ruff counts nested event methods together.
"deopjufy_view/app.py" = ["C901", "PLR0912"]
# Ruff 0.16 split positional-argument counting from PLR0913. These exact files
# retain existing explicit data-flow signatures until that tracked debt is refactored.
"deopjufier/commands/simple_shared/__init__.py" = ["PLR0917"]
"deopjufier/extract/object_tables_helpers/_coalesce.py" = ["PLR0917"]
"deopjufier/extract/semantic_provenance/__init__.py" = ["PLR0917"]
