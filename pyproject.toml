[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pylint]
max-branches = 7
max-statements = 40

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "timeout(seconds): per-test timeout in seconds.",
]

[tool.coverage.run]
branch = true
source = ["deopjufier"]
omit = [
    "refs/*",
    "tests/*",
    ".venv/*",
    ".pytest_cache/*",
    ".ruff_cache/*",
]
parallel = true

[tool.coverage.report]
skip_empty = true
skip_covered = false
sort = "Cover"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty]
src.exclude = ["refs/**"]
